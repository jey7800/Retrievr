# Set `reviewed: true` once a human has checked it against the live site.
ground_truth_version: 1
site: airbus
scope: >-
  Documents in the 2024 and 2025 panels of the annual reports page: annual report,
  annual report overview or annual review, report of the board of directors, financial
  statements and the ESEF package.
fiscal_years: [2024, 2025]
captured_at: 2026-11-20
reviewed: true
notes: >-
  The 2025 panel had no full annual report on the capture date. The ESEF zip is the
  annual financial report in its regulated format and is typed annual_report.
requests:
  - text: Airbus financial statements since 2024
    expect: {types: [financial_statements], fiscal_years: [2024, 2025]}
  - text: Annual reports and board reports for 2024
    expect: {types: [annual_report], fiscal_years: [2024]}
  - text: Tous les documents annuels 2025
    expect: {fiscal_years: [2025]}
