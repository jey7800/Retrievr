# visitor sees: section heading, link label, tile), then reviewed entry by entry.
# Set `reviewed: true` once a human has checked it against the live site.
ground_truth_version: 1
site: barclays
scope: >-
  Every downloadable document on the 2024 and 2025 financial results pages
  (financial-results-2024/ and financial-results-2025/): Barclays PLC results, fixed income,
  subsidiaries (Barclays Bank PLC, Barclays Bank UK PLC, Barclays Bank Ireland PLC) and the
  other results documents. The Modern Slavery Statement linked in the page footer is out of
  scope.
fiscal_years: [2024, 2025]
captured_at: 2026-11-20
reviewed: true
notes: >-
  Tabs are categories (group, fixed income, subsidiaries, other); periods come from
  the tile headings (FY, H1, Q1, Q3) or, for subsidiaries, from the tile id. 6-K filings are
  typed quarterly_report (Q1, Q3) or half_year_report (H1). "Results Announcement" is the
  results release.
requests:
  - text: Barclays PLC and subsidiaries Pillar 3 reports for 2025
    expect: {types: [pillar3], fiscal_years: [2025]}
  - text: Fixed income presentations and call transcripts since 2024
    expect: {types: [fixed_income_presentation, fixed_income_call_transcript], fiscal_years: [2024, 2025]}
  - text: Communiqués de résultats et tableaux financiers Excel de 2024
    expect: {types: [press_release, financial_data_supplement], fiscal_years: [2024]}
