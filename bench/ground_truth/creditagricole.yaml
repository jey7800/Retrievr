# Ground truth recorded on 2026-11-20 in a browser (the year selectors load their lists
# with JavaScript), from what a visitor sees: section, item heading, file title, date,
# language label. Reviewed entry by entry. Set `reviewed: true` once checked by a human.
ground_truth_version: 1
site: creditagricole
scope: >-
  Documents of the financial publications page for fiscal years 2024 and 2025 in three
  sections, each with a year selector: financial results (Crédit Agricole S.A. quarterly
  results), Crédit Agricole S.A. reference documents (universal registration document,
  Pillar 3, remuneration) and Crédit Agricole Group documents. Theme presentations and
  credit updates are out of scope.
fiscal_years: [2024, 2025]
captured_at: 2026-11-20
reviewed: false
notes: >-
  Links are opaque (/pdfPreview/<id>); the file name is only in the link title. Previous
  years load through an XHR call (/display_next_publications) when a year is chosen;
  the HTML snapshot only holds the default selection. Every card is labelled "Français";
  transcripts are recorded as fr although their file names are English (to confirm).
  Amendments to the universal registration document are typed urd with the period of
  the figures they publish.
requests:
  - text: Communiqués de presse et séries trimestrielles de 2025
    expect: {types: [press_release, quarterly_series], fiscal_years: [2025]}
  - text: Universal registration documents and their amendments since 2024
    expect: {types: [urd], fiscal_years: [2024, 2025]}
  - text: Pillar 3 risk reports for 2024
    expect: {types: [pillar3], fiscal_years: [2024]}
