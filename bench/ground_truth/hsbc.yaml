# visitor sees: section heading, link label, tile), then reviewed entry by entry.
# Set `reviewed: true` once a human has checked it against the live site.
ground_truth_version: 1
site: hsbc
scope: >-
  Every downloadable document (PDF, XLSX, ZIP) listed under the 2024 and 2025 headings
  of the Group reporting archive (all-reporting/group, all items on one page with take=100):
  results releases, reports, presentations, data packs, Pillar 3, transcripts, filings and
  the other regulatory documents grouped there. Chinese versions are separate documents.
fiscal_years: [2024, 2025]
captured_at: 2026-11-20
reviewed: false
notes: >-
  The start page shows only the latest year; the archive groups items by year
  heading. Documents without a period in their label (tax strategy, G-SIB indicators...) keep
  the year of their heading as fiscal year and period. "Group Reporting Changes Data Pack"
  is typed quarterly_series_restated.
requests:
  - text: Annual and interim reports for 2024 and 2025, English only
    expect: {types: [annual_report, half_year_report], fiscal_years: [2024, 2025], languages: [en]}
  - text: Pillar 3 disclosures for 2025
    expect: {types: [pillar3], fiscal_years: [2025]}
  - text: Les data packs trimestriels et les présentations de résultats 2024
    expect: {types: [financial_data_supplement, results_presentation], fiscal_years: [2024]}
