# Ground truth recorded on 2026-11-20 in a browser (the list is loaded with JavaScript
# from a POST /api/search endpoint, 20 items per page), from what a visitor sees: title,
# date, tags. Reviewed entry by entry. Set `reviewed: true` once checked by a human.
ground_truth_version: 1
site: lvmh
scope: >-
  Downloadable publications (TÉLÉCHARGER) of the French publications page tagged
  RÉSULTATS or VENTES that relate to fiscal years 2024 and 2025: sales and results
  presentations, half-year financial reports, financial documents, consolidated accounts,
  "LVMH en bref" fact sheets, universal registration documents (PDF and ESEF) and annual
  reports. Items that open a web page (VISUALISER: press releases, interactive annual
  report) and items tagged only ESG or AUTRES THÉMATIQUES are out of scope.
fiscal_years: [2024, 2025]
captured_at: 2026-11-20
reviewed: false
notes: >-
  Files are served from the CMS CDN (lvmh-com.cdn.prismic.io) and, for older items, from
  a WordPress proxy path on www.lvmh.com. The 2025 ESEF package is published with an
  unusual ".xbri" extension. Annual documents published in the following year sit under
  the fiscal year they cover. No HTML snapshot can hold this list (XHR POST); it needs the
  browser capture planned for milestone 4.
requests:
  - text: Les rapports financiers semestriels et annuels depuis 2024
    expect: {types: [half_year_report, annual_report], fiscal_years: [2024, 2025]}
  - text: Sales and results presentations for 2025
    expect: {types: [results_presentation], fiscal_years: [2025]}
  - text: Consolidated accounts and universal registration documents for 2024
    expect: {types: [financial_statements, urd], fiscal_years: [2024]}
