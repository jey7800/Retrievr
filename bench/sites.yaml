# Benchmark sites. Qualified 2026-11-20 with the library's Fetcher (identifiable
# User-Agent, robots.txt respected, 1 request/s): one robots.txt and one start-page GET.
# Profiles are defined in bench/model.py. Blocked sites are never worked around: they
# stay in the list as cases for block detection.
sites:
  # -- European banks -------------------------------------------------------------
  - id: bnpparibas
    name: BNP Paribas
    category: european_bank
    start_url: https://invest.bnpparibas/analystes-investisseurs
    profile: no_direct_links
    qualified_on: 2026-11-20
  - id: societegenerale
    name: Société Générale
    category: european_bank
    start_url: https://investors.societegenerale.com/fr/base-documentaire?theme=finance&category[resultats-financiers]&fiscal[2025]
    profile: static_url_filters
    qualified_on: 2026-11-20
    recipe: societegenerale-ir@1.yaml
    snapshot: tests/fixtures/societegenerale
    ground_truth: true
    notes: >-
      The English results page links to this server-rendered document database.
      Paginated (rel=next); a page beyond the last returns unrelated documents.
