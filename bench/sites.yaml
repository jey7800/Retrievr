    qualified_on: 2026-11-20
    snapshot: bench/snapshots/creditagricole
    ground_truth: true
    notes: >-
      Server-rendered for the default selection, previous years load by XHR
      (/display_next_publications) from year selectors. Opaque links (/pdfPreview/<id>)
      with the file name in the title attribute. The snapshot holds the default view only.
