[project]
name = "retrievr"
version = "0.1.0.dev0"
description = "Find and download documents from websites, with an LLM only when needed."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "retrievr contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.28",
    "truststore>=0.10",
    "lxml>=5.3",
    "cssselect>=1.2",
    "pydantic>=2.9",
    "PyYAML>=6.0.2",
    "protego>=0.4",
]

[project.scripts]
retrievr = "retrievr.cli:main"

[project.optional-dependencies]
browser = [
    "playwright>=1.65",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "respx>=0.22",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-PyYAML>=6.0",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/retrievr"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "bench"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PTH", "S"]
ignore = [
    "RUF001", # ambiguous unicode in strings (French page text in tests)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "bench"]
mypy_path = "src"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["lxml", "lxml.*", "cssselect", "cssselect.*", "protego", "respx", "respx.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra", "--strict-markers"]
